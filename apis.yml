name: Trisk Bio
description: 'Trisk Bio is a preclinical AAV (adeno-associated virus) manufacturing partner / CDMO that
  develops bespoke, scalable processes for AAV gene therapies to enable affordable preclinical manufacturing.
  It supplies research-grade and non-human primate (NHP) study-grade vectors across capsid serotypes and
  transgenes, offering custom process development, high-throughput optimisation of a single transgene
  against multiple capsids, and purification and supply of partials as reference material. Backed by Matrix
  Partners, Trisk Bio is a healthtech / biomanufacturing company; at the time of this enrichment pass it
  publishes a marketing website but no public API, developer portal, or documentation surface.'
